<!doctype html>
<html lang="cs">
	<head>
		<meta charset="utf-8" />
		<!--
			`viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve to
			anything but zero: without it the page is letterboxed inside the notch
			rather than painting under it. No `maximum-scale`: pinch-to-zoom is
			the one thing a person who cannot read an 11 px label has left.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!--
			One person's dreams: nothing here is for a search index, a snippet, a
			cache or a training corpus. `robots.txt` keeps crawlers from asking;
			this is for anything that fetched the shell anyway, and nginx says the
			same in `X-Robots-Tag` for every response including the API's.
		-->
		<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f6f2ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Aspire" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-180.png" />
		<script>
			// Applied before first paint so a dark-mode launch never flashes linen.
			try {
				var t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') {
					document.documentElement.setAttribute('data-theme', t);
					// The status bar too: the browser reads the theme-color whose
					// `media` matches the *system* scheme, so the chosen scheme's
					// literal is handed to both metas. `theme.ts` keeps them in step
					// with the resolved ground from then on.
					var chosen = document.querySelector('meta[name="theme-color"][media*="' + t + '"]');
					var metas = document.querySelectorAll('meta[name="theme-color"]');
					if (chosen) for (var i = 0; i < metas.length; i++) metas[i].content = chosen.content;
				}
			} catch (e) {
				/* private mode: fall back to the system preference */
			}
		</script>
		%sveltekit.head%
		<style>
			/*
				The launch splash: the mark alone, in the ink, on the ground. Static
				markup below the app mount point, so it is on screen from the first
				paint, and the layout removes it the moment the app has rendered.
				Colours are the token roles, resolved before anything paints because
				the bundle's stylesheet is render-blocking in <head>.
			*/
			#splash {
				position: fixed;
				inset: 0;
				z-index: 100;
				display: grid;
				place-items: center;
				background: var(--ground);
				pointer-events: none;
				transition: opacity 300ms var(--ease-out);
			}
			#splash.splash-out {
				opacity: 0;
			}
			.splash-mark {
				width: 72px;
				height: 72px;
				color: var(--ink);
				animation: splash-rise 480ms var(--ease-settle) both;
			}
			@keyframes splash-rise {
				from {
					opacity: 0;
					transform: translateY(10px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.splash-mark {
					animation: none;
				}
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="tap">
		<!--
			impeccable direction contract · Aspire M0 · 2026-09-09
			THESIS: The empty board is already the board: one dream-shaped tile
			with the sky in it and the title where a title will be. It refuses the
			illustration-plus-caption empty state and the grid of grey boxes.
			OWN-WORLD: Prosper's grammar, warmed. Linen ground, warm ink, white
			cards raised by luminance, every button a pill, a floating glass bar.
			Two accents, ember and dusk, meeting in one sunrise gradient that stands
			in for a photograph. Inter 400/500/600, sentence case. Dark is charcoal:
			a print on a dark wall.
			STORY: He opens it, sees a sky-coloured card the size a dream will be,
			reads that there is none yet and one line on what to do, and adds the
			first from the pill on the card or the ember disc in the bar.
			FIRST VIEWPORT: Wordmark at 44 top-left. One 4:5 sky tile the width of
			the screen, drifting slowly; title and why at its foot over the scrim;
			a glass pill "Přidat sen" under them. The glass bar at the bottom, ember
			disc in the second slot.
			FORM: Sibling extension of Prosper's third edition, brief-pinned; no
			seed roll.
			FINISH: unreviewed and undocumented is unfinished; this build ends with
			the finish review, the verdict, DESIGN.md, and every shipping raster
			carrying its provenance.
		-->
		<div style="display: contents">%sveltekit.body%</div>
		<div id="splash" aria-hidden="true">
			<svg class="splash-mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
				<defs>
					<clipPath id="splash-above"><rect x="0" y="0" width="512" height="292"></rect></clipPath>
				</defs>
				<circle
					cx="256"
					cy="250"
					r="104"
					fill="currentColor"
					clip-path="url(#splash-above)"
				></circle>
				<rect x="128" y="316" width="256" height="40" rx="20" fill="currentColor"></rect>
			</svg>
		</div>
	</body>
</html>
