# The app container's nginx: static files, the media volume, and one proxy
# rule for the API.
#
# **All three are one origin on purpose.** It is what retires the CORS
# allowlist — `Cors:Origins` in the API exists only for a dev server on
# another port — and it is what lets the service worker cache `/media/`
# images with the same rules as the app's own assets.
#
# TLS is not here. The host's nginx terminates it and proxies to the single
# published port; this server never sees a certificate.

# Pairing attempts, per client address — and the address is only a client's
# because of the `real_ip` block in the server below. Read that first.
#
# The API rate-limits this endpoint itself; this is the same fence one layer
# out, because a limiter that lives in the process resets every time the
# process does, and `docker compose up -d --build` restarts it.
limit_req_zone $binary_remote_addr zone=aspire_pair:1m rate=1r/s;

# And the endpoint as a whole, from everywhere — the second fence for the
# API's global window. Per-address counting is what a caller with many
# addresses is built to walk past; keyed on the server name, this bucket does
# not care how many there are.
limit_req_zone $server_name zone=aspire_pair_all:1m rate=20r/m;

server {
	listen 80;
	server_name _;

	# ── whose address this is ────────────────────────────────────────────────
	#
	# Every request arrives from the host's nginx, so `$remote_addr` is a proxy
	# and the same proxy every time. Without this block the pairing limiter
	# above would put the entire internet in one bucket.
	#
	# `real_ip_recursive` stays **off**, and that is the security property
	# rather than a default nobody touched. Off means nginx takes the **last**
	# entry in `X-Forwarded-For` — the one the host's nginx appended, which is
	# the peer it actually accepted a connection from. Everything to the left
	# of it was written by the caller and is worth nothing.
	set_real_ip_from 127.0.0.0/8;
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	real_ip_header X-Forwarded-For;
	real_ip_recursive off;

	root /usr/share/nginx/html;
	index index.html;

	# `pnpm build` runs with `precompress: true`, so every asset already has a
	# `.gz` twin in the image and nginx hands that over instead of compressing
	# the same bytes on every request. The `.br` twins are not served: the
	# stock nginx build has no brotli module.
	gzip_static on;

	# For what has no twin — the proxied JSON, mainly.
	gzip on;
	gzip_types application/json;
	gzip_proxied any;
	gzip_min_length 1024;

	# Nothing here is worth revalidating a stale copy of, and the service worker
	# is the thing that actually makes the app fast. Overridden below for the
	# kinds of file whose name already encodes their content.
	add_header Cache-Control "no-cache" always;
	include /etc/nginx/snippets/headers.conf;

	# ── the API ──────────────────────────────────────────────────────────────

	# The one unauthenticated endpoint, and so the one worth fencing. An exact
	# match wins over a prefix regardless of order.
	location = /api/v1/pair {
		limit_req zone=aspire_pair burst=5 nodelay;
		limit_req zone=aspire_pair_all burst=5 nodelay;
		limit_req_status 429;

		resolver 127.0.0.11 valid=10s ipv6=off;
		set $aspire_pair http://api:8080;
		proxy_pass $aspire_pair$request_uri;

		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	location /api/ {
		# `api` is resolved **per request**, not once at startup.
		#
		# nginx resolves a literal hostname in `proxy_pass` when it loads its
		# config and then holds that address forever. Rebuild the API container
		# and Docker hands it a new IP — nginx keeps proxying to the old one and
		# every request 502s until somebody thinks to reload nginx. Going
		# through a variable forces a lookup each time; `$request_uri` is then
		# required, because a variable `proxy_pass` passes no URI of its own.
		resolver 127.0.0.11 valid=10s ipv6=off;
		set $aspire_api http://api:8080;
		proxy_pass $aspire_api$request_uri;

		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

		# A photograph from a phone. The client downscales to 2048 px before
		# sending (PLAN.md §4), but a five-image dream in one request is still
		# well past the 1 MB default, which is a number chosen for form posts.
		client_max_body_size 32m;

		# An upload on a train is never in a hurry.
		proxy_read_timeout 120s;
	}

	# ── the photographs ──────────────────────────────────────────────────────

	# Served straight from the media volume, read-only, never through the API.
	# A file's path carries the dream and the size, and a re-processed image
	# gets a new name, so a year of cache is safe.
	location /media/ {
		alias /usr/share/nginx/media/;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include /etc/nginx/snippets/headers.conf;
	}

	# ── the app ──────────────────────────────────────────────────────────────

	# Hashed filenames: the name changes when the bytes do, so the browser never
	# has to ask again.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include /etc/nginx/snippets/headers.conf;
	}

	# Self-hosted, and the reason the app has type offline. The names are stable
	# rather than hashed, so this is a month rather than a year.
	location /fonts/ {
		add_header Cache-Control "public, max-age=2592000" always;
		include /etc/nginx/snippets/headers.conf;
	}

	# `/sin-slavy` is `sin-slavy.html` — the routes are prerendered. `200.html`
	# is the fallback `adapter-static` emits for anything that is not, and it is
	# what makes a deep link work on a client-side route.
	location / {
		try_files $uri $uri.html $uri/index.html /200.html;
	}
}
